name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Budowanie pliku APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Akceptacja licencji Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Instalacja zależności npm
        run: npm ci

      - name: Budowanie aplikacji webowej
        run: npm run build

      - name: Przygotowanie projektu Capacitor Android
        run: |
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "Brak poprawnego projektu Android."
            rm -rf android
            npx cap add android
          else
            echo "Znaleziono istniejący projekt Android."
          fi

          npx cap sync android

          echo "android.builder.sdkDownload=true" >> android/gradle.properties

      # ============================================================
      # GENEROWANIE IKON ANDROID Z public/favicon-512.png
      # ============================================================

      - name: Instalacja Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

      - name: Generowanie ikon Android z favicon-512.png
        run: |
          python3 <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          source = Path("public/favicon-512.png")

          if not source.exists():
              raise SystemExit("ERROR: Brak pliku public/favicon-512.png")

          img = Image.open(source).convert("RGBA")

          print(f"Źródłowa ikona: {source}")
          print(f"Rozmiar źródła: {img.size}")

          # --------------------------------------------------------
          # Android launcher icon sizes
          # --------------------------------------------------------

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          res = Path("android/app/src/main/res")

          for folder, size in sizes.items():
              directory = res / folder
              directory.mkdir(parents=True, exist_ok=True)

              resized = ImageOps.contain(
                  img,
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              # Przezroczyste tło
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))

              x = (size - resized.width) // 2
              y = (size - resized.height) // 2

              canvas.alpha_composite(resized, (x, y))

              canvas.save(
                  directory / "ic_launcher.png",
                  "PNG",
                  optimize=True
              )

              canvas.save(
                  directory / "ic_launcher_round.png",
                  "PNG",
                  optimize=True
              )

              print(f"Generated {folder}: {size}x{size}")

          # --------------------------------------------------------
          # Adaptive icon foreground
          #
          # Android używa tego zamiast zwykłego ic_launcher.png
          # na nowszych wersjach systemu.
          # --------------------------------------------------------

          foreground_sizes = {
              "mipmap-mdpi": 108,
              "mipmap-hdpi": 162,
              "mipmap-xhdpi": 216,
              "mipmap-xxhdpi": 324,
              "mipmap-xxxhdpi": 432,
          }

          for folder, size in foreground_sizes.items():
              directory = res / folder

              # Powiększamy grafikę tak, aby dobrze mieściła się
              # w bezpiecznym obszarze adaptive icon.
              foreground = ImageOps.contain(
                  img,
                  (int(size * 0.72), int(size * 0.72)),
                  Image.Resampling.LANCZOS
              )

              canvas = Image.new(
                  "RGBA",
                  (size, size),
                  (0, 0, 0, 0)
              )

              x = (size - foreground.width) // 2
              y = (size - foreground.height) // 2

              canvas.alpha_composite(foreground, (x, y))

              canvas.save(
                  directory / "ic_launcher_foreground.png",
                  "PNG",
                  optimize=True
              )

              print(f"Generated adaptive foreground: {folder}")

          # --------------------------------------------------------
          # Adaptive icon background
          # --------------------------------------------------------

          for folder in foreground_sizes:
              directory = res / folder

              background = Image.new(
                  "RGBA",
                  (108, 108),
                  (8, 11, 20, 255)
              )

              background.save(
                  directory / "ic_launcher_background.png",
                  "PNG",
                  optimize=True
              )

          print("Ikony Android zostały wygenerowane.")
          PY

      # ============================================================
      # NADPISANIE ADAPTIVE ICON XML
      # ============================================================

      - name: Konfiguracja adaptive icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#080B14</color>
          </resources>
          EOF

      # ============================================================
      # SPRAWDZENIE IKON PRZED BUILD
      # ============================================================

      - name: Sprawdzenie ikon
        run: |
          echo "=== ICON FILES ==="

          find android/app/src/main/res \
            -path "*/mipmap-*/*ic_launcher*" \
            -type f \
            -print

          echo ""
          echo "=== SOURCE ICON ==="
          file public/favicon-512.png

      # ============================================================
      # PODPISYWANIE RELEASE APK
      # ============================================================

      - name: Przygotowanie klucza podpisującego
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/js-duo-release.jks
          chmod 600 android/js-duo-release.jks

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Kompilacja APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/js-duo-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android

          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/release/* ]]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # ============================================================
      # PODPIS APK
      # Gradle może wygenerować wariant release jako unsigned.
      # Podpisujemy finalny APK jawnie przez apksigner.
      # ============================================================

      - name: Podpisanie release APK
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          APK_DIR="android/app/build/outputs/apk/release"
          UNSIGNED="$APK_DIR/app-release-unsigned.apk"
          SIGNED="$APK_DIR/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"

          if [ ! -f "$UNSIGNED" ]; then
            echo "ERROR: Nie znaleziono unsigned APK: $UNSIGNED"
            find "$APK_DIR" -maxdepth 2 -type f -print
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks android/js-duo-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$UNSIGNED"

          ls -lh "$SIGNED"

      # ============================================================
      # WERYFIKACJA APK PRZED PUBLIKACJĄ
      # ============================================================

      - name: Weryfikacja podpisu i integralności APK
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Nie znaleziono $APK"
            find android/app/build/outputs/apk -type f -print
            exit 1
          fi

          echo "=== APK INFO ==="
          ls -lh "$APK"

          echo "=== ZIPALIGN ==="
          ZIPALIGN="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/zipalign"
          "$ZIPALIGN" -c -v 4 "$APK"

          echo "=== APKSIGNER ==="
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

          echo "=== SHA256 ==="
          sha256sum "$APK"

      # ============================================================
      # APK ARTIFACT
      # ============================================================

      - name: Udostępnienie APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: JS-Duo-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # GITHUB RELEASE
      # Uruchamia się tylko po wypchnięciu taga vX.Y.Z.
      # ============================================================

      - name: Publikacja GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          tag_name: v1.0.6
          name: JS Duo v1.0.6
          files: android/app/build/outputs/apk/release/app-release.apk
