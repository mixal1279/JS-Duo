name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Budowanie pliku APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalacja Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Akceptacja licencji Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Instalacja zależności npm
        run: npm install

      - name: Budowanie aplikacji webowej
        run: npm run build

      - name: Inicjalizacja i synchronizacja Capacitor Android
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Brak kompletnego katalogu android lub pliku gradlew - generowanie..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          echo "android.builder.sdkDownload=true" >> android/gradle.properties
          chmod +x android/gradlew

      - name: Kompilacja pliku APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Znalezienie i udostępnienie pliku APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: JS-Duo-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
