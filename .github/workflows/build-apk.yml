name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Budowanie pliku APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalacja Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Akceptacja licencji Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Instalacja zależności npm
        run: npm install

      - name: Budowanie aplikacji webowej
        run: npm run build

      - name: Synchronizacja Capacitor Android (bez kasowania natywnego projektu)
        run: |
          if [ ! -d "android" ]; then
            echo "Brak katalogu android - generowanie od zera..."
            npx cap add android
          fi
          npx cap sync android
          echo "android.builder.sdkDownload=true" >> android/gradle.properties

      - name: Kompilacja pliku APK (assembleDebug)
        run: gradle assembleDebug --no-daemon --stacktrace -p android

      - name: Znalezienie i udostępnienie pliku APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: JS-Duo-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
