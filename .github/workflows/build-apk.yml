name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Budowanie pliku APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalacja Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Konfiguracja Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalacja zależności npm
        run: npm install

      - name: Budowanie aplikacji webowej
        run: npm run build

      - name: Inicjalizacja platformy Android Capacitor
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Nadanie uprawnień do uruchomienia gradlew
        run: chmod +x android/gradlew

      - name: Kompilacja pliku APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Udostępnienie gotowego pliku APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: JS-Duo-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
