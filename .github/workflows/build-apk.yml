name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Budowanie pliku APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalacja Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Akceptacja licencji Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Instalacja zależności npm
        run: npm ci

      - name: Budowanie aplikacji webowej
        run: npm run build

      - name: Przygotowanie projektu Capacitor Android
        run: |
          if [ ! -f "android/settings.gradle" ] && [ ! -f "android/settings.gradle.kts" ]; then
            echo "Projekt Android nie istnieje lub jest niekompletny."
            rm -rf android
            npx cap add android
          else
            echo "Znaleziono istniejący projekt Android."
          fi

          echo "Synchronizacja Capacitor..."
          npx cap sync android

          echo "Sprawdzanie struktury projektu:"
          ls -la android

          echo "Sprawdzanie Gradle:"
          ls -la android/gradlew

          echo "android.builder.sdkDownload=true" >> android/gradle.properties

      - name: Kompilacja APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Udostępnienie APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: JS-Duo-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
